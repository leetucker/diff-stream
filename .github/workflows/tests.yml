name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
        polars: ['polars==1.37.0', 'polars>=2']
    env:
      STREAM_LIMITS_MAX_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      # Until the shared launcher is released, exercise its source checkout.
      - uses: actions/checkout@v4
        with:
          repository: leetucker/stream-limits
          path: .ci/stream-limits
      - run: python -m pip install -e '.ci/stream-limits[testing]'
      # Shared treatment-effect APIs are currently unreleased upstream.
      - uses: actions/checkout@v4
        with:
          repository: leetucker/hdfe-stream
          path: .ci/hdfe-stream
      - run: python -m pip install -e '.ci/hdfe-stream[formula]'
      - run: python -m pip install -e '.[test,docs]' '${{ matrix.polars }}'
      - run: pytest -q
      - run: sphinx-build -W -b html docs docs/_build/html

  portable-resources:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      STREAM_LIMITS_MAX_THREADS: '2'
      POLARS_MAX_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: leetucker/stream-limits
          path: .ci/stream-limits
      - run: python -m pip install -e '.ci/stream-limits[testing]'
      # Shared treatment-effect APIs are currently unreleased upstream.
      - uses: actions/checkout@v4
        with:
          repository: leetucker/hdfe-stream
          path: .ci/hdfe-stream
      - run: python -m pip install -e '.ci/hdfe-stream[formula]'
      - run: python -m pip install -e '.[test]'
      # The resource fixture uses an explicit watchdog policy on every OS;
      # kernel-only checks skip unless a controller was explicitly delegated.
      - run: python -m pytest tests/test_memory_layouts.py tests/test_gardner.py tests/test_etwfe.py tests/test_cs_balance.py tests/test_bacon_extended.py tests/test_twfe_weights.py tests/test_reference_populations.py tests/test_refit_bootstrap.py tests/test_parallel_bootstrap.py -m resource -q
